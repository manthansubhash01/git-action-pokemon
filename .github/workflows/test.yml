name: Test Automation
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Initialize Node
        uses: actions/setup-node@v4
        
      - name: Install Dependencies
        run: npm install
        
      - name: Run backend tests
        run: npm test
